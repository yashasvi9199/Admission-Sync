name: Automated GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'docs/CHANGELOG.md'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Release Helper
        run: |
          python .github/scripts/release-helper.py

      - name: Commit and push RELEASE.md updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/RELEASE.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(release): update release ledger [skip ci]"
            git push origin main
          else
            echo "No changes to docs/RELEASE.md"
          fi

      - name: Read Release Info
        id: release_info
        run: |
          VERSION=$(cat .github/outputs/version.txt)
          TAG=$(cat .github/outputs/tag.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9')
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          cat .github/outputs/release_notes.md >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Package Release APK
        run: |
          APK_PATH=""
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          
          VERSION="${{ steps.release_info.outputs.version }}"
          cp "$APK_PATH" "Aero Punchin $VERSION.apk"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.release_info.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and Push Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${{ steps.release_info.outputs.tag }}" -m "Release version ${{ steps.release_info.outputs.version }}"
          git push origin "${{ steps.release_info.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: AeroPunchin ${{ steps.release_info.outputs.tag }}
          body: ${{ steps.release_info.outputs.notes }}
          files: |
            Aero Punchin ${{ steps.release_info.outputs.version }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
